name: Release

# Publishes graphforge-neo4j to PyPI when you push a version tag (e.g. v0.1.0).
# Uses PyPI Trusted Publishing (OIDC) — no API token is stored in the repo.
#
# One-time setup on PyPI: create the project's "trusted publisher" pointing at
#   owner: vinothhacks   repo: graphforge-neo4j
#   workflow: release.yml   environment: pypi
# (https://docs.pypi.org/trusted-publishers/)

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
