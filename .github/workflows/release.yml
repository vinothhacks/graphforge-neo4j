name: Release

# Pull requests and version tags verify packages. To publish, dispatch this
# workflow on the version tag with publish enabled. Configure required
# reviewers on pypi and testpypi and match the environment in Trusted
# Publishing. The publish job also checks that this run was approved.
on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Request publication of the verified version tag
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/.github/constraints.txt
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build and check wheel and sdist
        run: |
          python -m pip install build twine setuptools wheel
          python -m build --no-isolation
          python -m twine check --strict dist/*.whl dist/*.tar.gz
          sha256sum -- dist/*.whl dist/*.tar.gz > SHA256SUMS
      - name: Validate the tag against the built version
        id: tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from packaging.utils import parse_wheel_filename
          from packaging.version import Version

          tag = Version(os.environ["GITHUB_REF_NAME"].removeprefix("v"))
          wheel, = Path("dist").glob("*.whl")
          _, built, _, _ = parse_wheel_filename(wheel.name)
          if tag != built:
              raise SystemExit(f"Tag version {tag} differs from built version {built}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"prerelease={str(tag.is_prerelease).lower()}", file=output)
          PY
      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/changelog_section.py "$GITHUB_REF_NAME" > release-notes.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: |
            dist/
            SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 14

  verify-packages:
    name: verify packaged installs against disposable Neo4j
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: ${{ runner.temp }}/candidate
      - name: Start disposable Neo4j
        run: docker compose -f docker-compose.ci.yml up -d --wait neo4j
      - name: Verify wheel and sdist in separate environments
        working-directory: ${{ runner.temp }}/candidate
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/.github/constraints.txt
          PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/.github/constraints.txt
          NEO4J_DRIVER: "6.3.0"
          NEO4J_URI: bolt://127.0.0.1:7687
          NEO4J_USER: neo4j
          NEO4J_DATABASE: neo4j
        run: |
          set -euo pipefail
          compose="${GITHUB_WORKSPACE}/docker-compose.ci.yml"
          auth="$(docker compose -f "$compose" exec -T neo4j printenv NEO4J_AUTH)"
          export NEO4J_PASSWORD="${auth#*/}"
          echo "::add-mask::$NEO4J_PASSWORD"
          sha256sum --check SHA256SUMS
          for archive in dist/*.whl dist/*.tar.gz; do
            smoke_dir="$(mktemp -d)"
            python -m venv "$smoke_dir/venv"
            bin="$smoke_dir/venv/bin"
            "$bin/python" -m pip install pip
            "$bin/python" -m pip install "$archive[mcp]" "neo4j==${NEO4J_DRIVER}"
            "$bin/python" -m pip check
            mkdir "$smoke_dir/home" "$smoke_dir/work"
            (
              export HOME="$smoke_dir/home"
              cd "$smoke_dir/work"
              "$bin/graphforge" --help
              "$bin/graphforge" init
              "$bin/graphforge" doctor
              printf 'NEO4J_URI=%s\n' "$NEO4J_URI" > .env
              preview="$("$bin/graphforge" mcp install --client cursor --dry-run)"
              printf '%s\n' "$preview"
              grep -q '"mcpServers"' <<< "$preview"
              test ! -e .cursor/mcp.json
            )
          done
      - name: Stop disposable Neo4j
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  publish:
    name: publish verified packages
    needs: [build, verify-packages]
    # A rerun can retain approval history. Require a fresh dispatch for publishing.
    if: >-
      github.event_name == 'workflow_dispatch'
      && inputs.publish
      && startsWith(github.ref, 'refs/tags/v')
      && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ needs.build.outputs.prerelease == 'true' && 'testpypi' || 'pypi' }}
      url: ${{ needs.build.outputs.prerelease == 'true' && 'https://test.pypi.org/p/graphforge-neo4j' || 'https://pypi.org/p/graphforge-neo4j' }}
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Require explicit environment approval
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ENV: ${{ needs.build.outputs.prerelease == 'true' && 'testpypi' || 'pypi' }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" |
            jq -e --arg name "$RELEASE_ENV" 'any(.[]; .state == "approved" and any(.environments[]; .name == $name))'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
      - name: Verify artifact checksums
        run: sha256sum --check SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          repository-url: ${{ needs.build.outputs.prerelease == 'true' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          skip-existing: ${{ needs.build.outputs.prerelease == 'true' }}

  github-release:
    name: github release
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes
      - name: Verify artifact checksums
        run: sha256sum --check SHA256SUMS
      - uses: softprops/action-gh-release@5be0e66d93ac7ed76da52eca8bb058f665c3a5fe # v2.4.2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          files: |
            dist/*.whl
            dist/*.tar.gz
            SHA256SUMS
          fail_on_unmatched_files: true
