name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # The gate. Everything else is advisory until it has proved itself once.
  # ---------------------------------------------------------------------------
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest -q -m "not e2e_critical and not e2e_full"

  e2e-critical:
    name: e2e-critical (Neo4j, blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Start Neo4j
        run: docker compose -f docker-compose.ci.yml up -d --wait neo4j
      - name: e2e-critical
        env:
          GF_E2E_CRITICAL: "1"
          NEO4J_URI: bolt://127.0.0.1:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: graphforge-ci-password
          NEO4J_DATABASE: neo4j
        run: pytest -q -m e2e_critical
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  e2e-full:
    name: e2e-full (playground, main/nightly)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev,mcp]"
      - name: Start playground
        run: docker compose -f examples/docker-compose.yml up -d --wait
      - name: e2e-full
        env:
          GF_E2E_FULL: "1"
          NEO4J_URI: bolt://127.0.0.1:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: graphforge-playground
          NEO4J_DATABASE: neo4j
        run: pytest -q -m e2e_full
      - name: Tear down
        if: always()
        run: docker compose -f examples/docker-compose.yml down -v

  # ---------------------------------------------------------------------------
  # Coverage. Measures only - there is deliberately no fail-under yet, see the
  # comment on [tool.coverage.report] in pyproject.toml. Read the XML artifact
  # (or the term report in the log) for a few runs, then set a floor.
  # ---------------------------------------------------------------------------
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test with coverage
        run: pytest --cov=graphforge --cov-report=xml --cov-report=term -m "not e2e_critical and not e2e_full"
      - name: Upload coverage.xml
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Lint. BLOCKING.
  #
  # This was non-blocking while the rule set in pyproject.toml had never been
  # run against the tree. It has been now, and `ruff check src tests` is clean,
  # so a new violation should fail the build rather than scroll past.
  #
  # `ruff format --diff` stays informational: the tree has never been formatted,
  # so it reports a large diff. Do that reformat as its own isolated commit
  # before turning it into `--check`.
  # ---------------------------------------------------------------------------
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned to the same version as .pre-commit-config.yaml so a local
      # `pre-commit run` and CI cannot disagree about what "clean" means.
      - name: Install ruff
        run: python -m pip install "ruff==0.8.6"
      - name: ruff check
        run: ruff check --output-format=github src tests
      - name: ruff format (report only)
        run: ruff format --diff src tests

  # ---------------------------------------------------------------------------
  # Type checking. BLOCKING.
  #
  # This was non-blocking while [tool.mypy] had never been executed against the
  # tree and the baseline was unknown. The baseline is zero, so keep it there.
  # ---------------------------------------------------------------------------
  types:
    name: types (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"   # the floor: catches 3.11+-only syntax
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      # Targets are configured in pyproject.toml (mypy_path = src, packages = graphforge).
      - name: mypy
        run: mypy

  # ---------------------------------------------------------------------------
  # Packaging. Same build the release workflow runs, on every push, so a broken
  # sdist/wheel is caught long before someone cuts a tag.
  # ---------------------------------------------------------------------------
  build:
    name: build + metadata check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
      - name: Check metadata
        run: python -m twine check --strict dist/*
      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install --quiet dist/*.whl
          /tmp/smoke/bin/graphforge --version
          /tmp/smoke/bin/graphforge --help > /dev/null
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-ci
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # End-to-end against real Neo4j + PostgreSQL.
  #
  # Deliberately NOT run on pull requests: it pulls two container images and
  # takes minutes. Pushes to main and manual dispatch only.
  #
  # NON-BLOCKING ON PURPOSE. scripts/integration_test.sh was authored in an
  # environment with no docker and no network, so it has never been executed
  # end to end. Its shell syntax, its embedded Python/XML, and the Java fixture
  # it writes were all validated statically (`bash -n`, `compile()`,
  # ElementTree, and graphforge's own java parser + link matcher), but a green
  # run is still unproven.
  #
  # TO MAKE THIS BLOCKING: dispatch it manually, fix whatever it finds, then
  # delete the `continue-on-error: true` line below.
  # ---------------------------------------------------------------------------
  integration:
    name: integration (real Neo4j + PostgreSQL, non-blocking)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Runtime deps only: this test drives the installed console script, and
      # its probes reuse graphforge's own psycopg2 / neo4j drivers.
      - name: Install graphforge
        run: python -m pip install -e .
      - name: Start Neo4j 5 + PostgreSQL 16
        run: docker compose -f docker-compose.ci.yml up -d --wait
      # Invoked via `bash` rather than `./` so the test does not depend on the
      # executable bit surviving in the git index (this repo is developed on
      # Windows with core.filemode=false).
      - name: Run the end-to-end test
        run: bash scripts/integration_test.sh
      - name: Service logs
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs --no-color --tail=300
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  # ---------------------------------------------------------------------------
  # Secret scan.
  #
  # This used to match `glpat-` only, across .py/.json/.md only -- so a GitHub
  # token, an AWS key or a private key committed in a workflow, a shell script
  # or a .env would all have sailed through. It now scans the tracked tree and
  # checks the credential formats this project actually comes into contact with.
  #
  # It is a backstop, not a guarantee: it catches recognisable formats, not a
  # password in a config file. .gitignore is what keeps .env out of the repo.
  # ---------------------------------------------------------------------------
  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fail on recognisable credentials
        run: |
          set -uo pipefail
          # Scan tracked files only, and never this workflow (it contains the
          # patterns themselves).
          mapfile -t FILES < <(git ls-files | grep -v '^\.github/workflows/ci\.yml$')
          fail=0
          check() {
            if grep -nE "$2" "${FILES[@]}" 2>/dev/null; then
              echo "::error::$1 found"; fail=1
            fi
          }
          check "GitLab token"          'glpat-[A-Za-z0-9_-]{20}'
          check "GitHub token"          '(ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36}'
          check "GitHub fine-grained token" 'github_pat_[A-Za-z0-9_]{50,}'
          check "AWS access key id"     'AKIA[0-9A-Z]{16}'
          check "Slack token"           'xox[baprs]-[A-Za-z0-9-]{10,}'
          check "Private key block"     'BEGIN (RSA |EC |OPENSSH |PGP )?PRIVATE KEY'
          # No `NEO4J_PASSWORD=` pattern here: it matches .env.example, the
          # README, CONNECT.md and integration_test.sh, all of which are
          # supposed to contain placeholders. The tracked-.env check below is
          # the precise form of that question.
          if [ "$fail" -ne 0 ]; then
            echo "Rotate the credential, then remove it from the tree and from history."
            exit 1
          fi
          echo "No recognisable credentials in tracked files."
      - name: Confirm .env is ignored, not merely absent
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked"; exit 1
          fi
          git check-ignore -q .env || { echo "::error::.env is not gitignored"; exit 1; }
          echo ".env is gitignored and untracked."
