# Local pre-commit hooks.
#
#   pip install -e ".[dev]"
#   pre-commit install                 # run on every `git commit`
#   pre-commit run --all-files         # one-off sweep over the whole tree
#   pre-commit autoupdate              # bump the pinned revs below
#
# `rev`s are pinned to released tags rather than floating, so a hook release can
# never silently change what a commit is checked against. The ruff pin must stay
# equal to the one in .github/workflows/ci.yml, or a local `pre-commit run` and
# CI will disagree about what "clean" means.
#
# The tree was formatted with ruff 0.16.5 in a697f48, so `pre-commit run
# --all-files` is a no-op for `ruff-format` on a clean checkout.

exclude: |
  (?x)^(
      repos/.*
    | output/.*
    | .*\.egg-info/.*
  )$

default_language_version:
  python: python3

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      # Lint. --fix applies the safe autofixes (import sorting, comprehension
      # rewrites, ...); --exit-non-zero-on-fix stops the commit so the changes
      # get staged and reviewed rather than silently applied.
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      # Format. Reads line-length / target-version from pyproject.toml.
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
