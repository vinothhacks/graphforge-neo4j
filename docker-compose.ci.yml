# Throwaway service stack for the end-to-end integration test.
#
#   docker compose -f docker-compose.ci.yml up -d
#   ./scripts/integration_test.sh
#   docker compose -f docker-compose.ci.yml down -v
#
# Differs from the top-level docker-compose.yml on purpose:
#   * no APOC plugin      - graphforge's Cypher is plain Cypher; the link passes
#                           avoid APOC deliberately, so CI proves that.
#   * no named volumes    - every run starts from an empty graph.
#   * small heap          - GitHub-hosted runners have 7 GB total.
#   * credentials are literal and public. This stack is disposable and is never
#     exposed outside the runner; do not copy these values anywhere real.
name: graphforge-ci

services:
  neo4j:
    image: neo4j:5-community
    container_name: graphforge-ci-neo4j
    environment:
      NEO4J_AUTH: neo4j/graphforge-ci-password
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
      # Accept connections from the runner, not just from inside the container.
      NEO4J_server_default__listen__address: 0.0.0.0
    ports:
      - "7474:7474"   # HTTP
      - "7687:7687"   # Bolt
    healthcheck:
      # cypher-shell ships inside the image, so this proves Bolt is actually
      # serving queries - not merely that a port is open.
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p graphforge-ci-password 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 40
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    container_name: graphforge-ci-postgres
    environment:
      POSTGRES_USER: graphforge
      POSTGRES_PASSWORD: graphforge-ci-password
      POSTGRES_DB: shopdb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphforge -d shopdb"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
