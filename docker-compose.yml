# Spin up a local Neo4j to forge graphs into:
#   docker compose up -d
# Browser UI:  http://localhost:7474   (user: neo4j)
# Bolt URI:    bolt://127.0.0.1:7687
# Change NEO4J_AUTH below and mirror it in your .env before first run.
services:
  neo4j:
    image: neo4j:5-community
    container_name: graphforge-neo4j
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt
    environment:
      # format is user/password
      NEO4J_AUTH: neo4j/please-change-me
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_server_memory_heap_max__size: 2G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  neo4j_data:
  neo4j_logs:
