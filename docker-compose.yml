# Spin up a local Neo4j to forge graphs into:
#   docker compose up -d
# Browser UI:  http://localhost:7474   (user: neo4j)
# Bolt URI:    bolt://127.0.0.1:7687
# Set NEO4J_PASSWORD in your local .env before starting Neo4j.
services:
  neo4j:
    image: neo4j:5-community
    container_name: graphforge-neo4j
    ports:
      - "127.0.0.1:7474:7474"   # HTTP browser
      - "127.0.0.1:7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in your local .env}"
      NEO4J_server_memory_heap_max__size: 2G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  neo4j_data:
  neo4j_logs:
