# Spin up a local Neo4j to forge graphs into:
#   docker compose up -d
# Browser UI:  http://localhost:7474   (user: neo4j)
# Bolt URI:    bolt://127.0.0.1:7687
# Change NEO4J_AUTH below and mirror it in your .env before first run.
services:
  neo4j:
    image: neo4j:5-community
    container_name: graphforge-neo4j
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt
    environment:
      # format is user/password
      NEO4J_AUTH: neo4j/please-change-me
      # APOC is installed but deliberately NOT unrestricted. graphforge needs no
      # APOC at all — docker-compose.ci.yml proves it by running the link passes
      # without the plugin — and "apoc.*" unrestricted would hand anything that
      # reaches this server apoc.load.jdbc / apoc.load.json, i.e. outbound network
      # and filesystem access. Add specific procedures here if you need them.
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_max__size: 2G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  neo4j_data:
  neo4j_logs:
